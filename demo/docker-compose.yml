services:
  # Valkey (Redis-compatible) - No persistence
  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: whitelabel-valkey
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - whitelabel

  # Whitelabel Theme API
  whitelabel-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: whitelabel-api
    environment:
      - NODE_ENV=production
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - whitelabel

  # Nginx - Serves demo and proxies API
  nginx:
    image: nginx:alpine
    container_name: whitelabel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/usr/share/nginx/html:ro
    depends_on:
      whitelabel-api:
        condition: service_healthy
    networks:
      - whitelabel

networks:
  whitelabel:
    driver: bridge
